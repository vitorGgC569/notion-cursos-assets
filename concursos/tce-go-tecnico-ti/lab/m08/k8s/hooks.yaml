apiVersion: v1
kind: Pod
metadata:
  name: hooks
spec:
  containers:
    - name: nginx
      image: nginx:1.30-alpine
      lifecycle:
        postStart:
          exec:
            command: ["sh", "-c", "echo iniciado > /usr/share/nginx/html/start.txt"]
        preStop:
          exec:
            command: ["sh", "-c", "sleep 6"]
